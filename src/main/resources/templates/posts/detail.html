<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${post.title}">글 상세</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <span class="logo">> MA_BLOG</span>
        <nav>
            <a th:href="@{/posts}">HOME</a>
            <a th:href="@{/posts/write}" sec:authorize="isAuthenticated()">WRITE</a>
            <a th:href="@{/logout}" sec:authorize="isAuthenticated()">LOGOUT</a>
            <a th:href="@{/login}" sec:authorize="!isAuthenticated()">LOGIN</a>
        </nav>
    </header>

    <div class="container">
        <div class="post-header">
            <span class="category-tag" th:text="${post.category}"></span>
            <h1 th:text="${post.title}"></h1>
            <div class="post-meta" th:text="${post.createdAt}"></div>
        </div>

        <div class="post-content" th:text="${post.content}"></div>

        <div style="margin-top:30px; border-top:1px solid #00ff41; padding-top:15px;">
            <a th:href="@{/posts}" class="btn">목록</a>
            <a th:href="@{/posts/edit/{id}(id=${post.id})}" class="btn"
               sec:authorize="isAuthenticated()">수정</a>
            <form th:action="@{/posts/delete/{id}(id=${post.id})}" method="post"
                  style="display:inline" sec:authorize="isAuthenticated()">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <button type="submit" class="btn btn-danger">삭제</button>
            </form>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 수정</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <span class="logo">> MA_BLOG</span>
        <nav>
            <a th:href="@{/posts}">HOME</a>
            <a th:href="@{/logout}">LOGOUT</a>
        </nav>
    </header>

    <div class="container">
        <h2 style="margin-bottom:20px; color:#00ff41;">> EDIT POST</h2>
        <form th:action="@{/posts/edit/{id}(id=${post.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label>TITLE</label>
                <input type="text" name="title" th:value="${post.title}">
            </div>
            <div class="form-group">
                <label>CATEGORY</label>
                <input type="text" name="category" th:value="${post.category}">
            </div>
            <div class="form-group">
                <label>CONTENT</label>
                <textarea name="content" rows="15" th:text="${post.content}"></textarea>
            </div>
            <div style="margin-top:10px;">
                <button type="submit" class="btn">> UPDATE</button>
                <a th:href="@{/posts}" class="btn">CANCEL</a>
            </div>
        </form>
    </div>
</body>
</html>

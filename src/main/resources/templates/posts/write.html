<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>글 작성</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="site-header">
        <span class="logo">> MA_BLOG</span>
        <nav>
            <a href="/posts">HOME</a>
            <a href="/logout">LOGOUT</a>
        </nav>
    </header>

    <div class="container">
        <h2 style="margin-bottom:20px; color:#00ff41;">> NEW POST</h2>
        <form action="/posts/write" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-group">
                <label>TITLE</label>
                <input type="text" name="title" placeholder="제목 입력">
            </div>
            <div class="form-group">
                <label>CATEGORY</label>
                <input type="text" name="category" placeholder="카테고리">
            </div>
            <div class="form-group">
                <label>CONTENT</label>
                <textarea name="content" rows="15" placeholder="내용 입력"></textarea>
            </div>
            <div style="margin-top:10px;">
                <button type="submit" class="btn">> SAVE</button>
                <a href="/posts" class="btn">CANCEL</a>
            </div>
        </form>
    </div>
</body>
</html>

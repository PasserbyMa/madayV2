<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MA_BLOG</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <span class="logo">> MA_BLOG</span>
    <nav>
        <a th:href="@{/}">HOME</a>
        <a th:href="@{/posts/write}" sec:authorize="isAuthenticated()">WRITE</a>
        <a th:href="@{/logout}" sec:authorize="isAuthenticated()">LOGOUT</a>
        <a th:href="@{/login}" sec:authorize="!isAuthenticated()">LOGIN</a>
    </nav>
</header>

<div class="dashboard">
    <div class="panel panel-sql">
        <div class="panel-title">> SQL_CONSOLE</div>
        <div sec:authorize="!isAuthenticated()" class="sql-auth-msg">[ 로그인 후 사용 가능 ]</div>
        <div sec:authorize="isAuthenticated()">
            <textarea id="sqlInput" class="sql-input" placeholder="SELECT * FROM posts;"></textarea>
            <div style="margin-top:10px">
                <button id="sqlRun" class="btn">▶ 실행</button>
                <button id="sqlClear" class="btn" style="margin-left:8px">CLR</button>
            </div>
            <div id="sqlResult" class="sql-result"></div>
        </div>
    </div>

    <div class="panel panel-posts">
        <div class="panel-title">> POSTS</div>
        <div th:if="${#lists.isEmpty(posts)}" class="sql-auth-msg">게시물이 없습니다.</div>
        <ul class="post-list">
            <li class="post-item" th:each="post : ${posts}">
                <a class="post-title post-link" href="#"
                   th:text="${post.title}" th:data-id="${post.id}"></a>
                <div class="post-meta">
                    <span class="category-tag" th:text="${post.category}"></span>
                    <span th:text="${post.createdAt}"></span>
                </div>
            </li>
        </ul>
        <div class="pagination" th:if="${totalPages > 1}">
            <a class="page-btn" th:classappend="${currentPage == 0} ? 'disabled'"
               th:href="@{/(page=${currentPage - 1})}">&lt;</a>
            <a class="page-btn"
               th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               th:text="${i + 1}"
               th:classappend="${i == currentPage} ? 'active'"
               th:href="@{/(page=${i})}"></a>
            <a class="page-btn" th:classappend="${currentPage == totalPages - 1} ? 'disabled'"
               th:href="@{/(page=${currentPage + 1})}">&gt;</a>
        </div>
    </div>
</div>

<!-- 모달 -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-box">
        <button class="modal-close" id="modalClose">[X]</button>
        <div class="modal-header">
            <span class="category-tag" id="modalCategory"></span>
            <h2 id="modalTitle"></h2>
            <div class="post-meta" id="modalDate"></div>
        </div>
        <div class="modal-content" id="modalContent"></div>
        <div class="modal-footer" id="modalFooter"></div>
    </div>
</div>

<script th:inline="javascript">
    const isAuth = /*[[${#authorization.expression('isAuthenticated()')}]]*/ false;
    const csrfToken = /*[[${_csrf.token}]]*/ '';
    const csrfHeader = /*[[${_csrf.headerName}]]*/ 'X-CSRF-TOKEN';
    const csrfParam = /*[[${_csrf.parameterName}]]*/ '_csrf';
    const contextPath = /*[[${ctx}]]*/ '';
</script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>

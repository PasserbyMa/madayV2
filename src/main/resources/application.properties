# Oracle DB 주소 (FREEPDB1은 Oracle의 실제 DB 공간 이름)
spring.datasource.url=jdbc:oracle:thin:@localhost:1521/FREEPDB1

# DB 접속 계정
spring.datasource.username=bloguser
spring.datasource.password=Blog1234

# Oracle용 드라이버 (JDBC가 Java ↔ DB 사이 통역사 역할)
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# MyBatis가 SQL 파일(XML)을 찾을 위치
mybatis.mapper-locations=classpath:mapper/*.xml

# DTO 클래스가 있는 패키지 (SQL 결과를 자바 객체로 변환할 때 사용)
mybatis.type-aliases-package=com.madayV2.blog.dto

# DB 컬럼명(created_at) → 자바 변수명(createdAt) 자동 변환
mybatis.configuration.map-underscore-to-camel-case=true

mybatis.configuration.jdbc-type-for-null=NULL
# 개발 중에는 Thymeleaf 캐시 끄기 (HTML 수정하면 바로 반영되게)
spring.thymeleaf.cache=false

# 앱 실행 포트
server.port=8080